name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "graalvm"
          java-version: "25"
      - name: Cache Gradle Packages
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Build Project
        run: ./gradlew assemble
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

  checkstyle:
    name: Checkstyle Analysis
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "graalvm"
          java-version: "25"
      - name: Cache Gradle Packages
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Run Checkstyle
        run: ./gradlew checkstyleMain

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    services:
      neo4j:
        image: neo4j:2026.10.1
        env:
          NEO4J_AUTH: none
          NEO4J_PLUGINS: '["apoc", "apoc-extended"]'
          NEO4J_dbms_usage__report_enabled: false
          NEO4J_apoc_import_file_enabled: true
          NEO4J_apoc_initializer_neo4j_0: CALL apoc.cypher.runSchemaFile("init.cypher")
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "graalvm"
          java-version: "25"
      - name: Cache Gradle Packages
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Run Unit Tests
        run: ./gradlew test
        env:
          QUARKUS_NEO4J_URI: bolt://localhost:7687
          QUARKUS_NEO4J_AUTHENTICATION_DISABLED: true

  docker-image-native:
    name: Docker image native
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: [checkstyle, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Build and Push Image
        uses: explorviz/deployment/.github/actions/build-and-deploy-quarkus-native@main
        env:
          # The shared action sets up JDK 21; Gradle provisions the JDK 25 toolchain itself.
          QUARKUS_NATIVE_CONTAINER_BUILD: "true"
          QUARKUS_NATIVE_BUILDER_IMAGE: quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25
        with:
          platforms: "linux/amd64,linux/arm64/v8"
          docker-username: ${{ secrets.DOCKER_USERNAME }}
          docker-password: ${{ secrets.DOCKER_PASSWORD }}
          image-name: ${{ vars.DOCKER_IMAGE_NAME }}
          image-tag: "native"

  docker-image-jvm:
    name: Docker image JVM
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: [checkstyle, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Build and Push Image
        uses: explorviz/deployment/.github/actions/build-and-deploy-quarkus-jvm@main
        with:
          platforms: "linux/amd64,linux/arm64/v8"
          docker-username: ${{ secrets.DOCKER_USERNAME }}
          docker-password: ${{ secrets.DOCKER_PASSWORD }}
          image-name: ${{ vars.DOCKER_IMAGE_NAME }}
          image-tag: "latest"
          additional-tags: "jvm"
