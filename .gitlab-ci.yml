default:
  tags:
    - exec-docker
  image: ghcr.io/graalvm/graalvm-community:25i-ol9
  cache: # Cache modules in between jobs
    key: $CI_COMMIT_REF_SLUG
    paths:
      - .gradle
  before_script:
    - export GRADLE_USER_HOME=`pwd`/.gradle

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  NEO4J_AUTH: "none"
  NEO4J_PLUGINS: '["apoc", "apoc-extended"]'
  NEO4J_dbms_usage__report_enabled: "false"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH"

stages:
  - build
  - code-analysis
  - test

build:
  stage: build
  script: ./gradlew assemble
  artifacts:
    paths:
      - build

spotless:
  stage: code-analysis
  script: ./gradlew spotlessCheck
  artifacts:
    paths:
      - build

checkstyle:
  stage: code-analysis
  script: ./gradlew checkstyleMain
  artifacts:
    paths:
      - build

.db-test:
  stage: test
  services:
    - name: neo4j:2026.10.1
      alias: neo4j
    - name: apache/kafka-native:4.3.1
      alias: kafka
      # Without these, the broker advertises localhost:9092, so clients bootstrap via kafka:9092
      # but are then redirected to localhost. Setting any KAFKA_* variable discards the image's
      # default configuration, hence the complete single-node KRaft setup.
      variables:
        KAFKA_NODE_ID: "1"
        KAFKA_PROCESS_ROLES: "broker,controller"
        KAFKA_LISTENERS: "CLIENT://:9092,INTERNAL://localhost:19092,CONTROLLER://localhost:9093"
        KAFKA_ADVERTISED_LISTENERS: "CLIENT://kafka:9092,INTERNAL://localhost:19092"
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CLIENT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
        KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
        KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
        KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  artifacts:
    paths:
      - build

unit-test:
  extends: .db-test
  script:
    - ./gradlew test -Dquarkus.test.profile=ci

integration-test:
  extends: .db-test
  script:
    - ./gradlew integrationTest
