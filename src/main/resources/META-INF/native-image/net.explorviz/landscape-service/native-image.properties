# gRPC's GrpcSslContexts holds constant ApplicationProtocolConfig instances (ALPN settings for HTTP/2)
# that end up in the image heap when the separate gRPC server is used. The class is an immutable
# configuration holder (with enum members), so it is safe to initialize at build time.
Args = --initialize-at-build-time=io.netty.handler.ssl.ApplicationProtocolConfig,io.netty.handler.ssl.ApplicationProtocolConfig$Protocol,io.netty.handler.ssl.ApplicationProtocolConfig$SelectorFailureBehavior,io.netty.handler.ssl.ApplicationProtocolConfig$SelectedListenerFailureBehavior
